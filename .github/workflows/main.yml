name: CI/CD Pipeline con Control de QA

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: 🧪 Validar Código e Imagen Docker (QA)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Para comparar con el commit anterior

      - name: Validar sintaxis del Dockerfile
        run: docker build -t test-image .

      - name: Generar resumen de cambios para QA
        run: |
          echo "## 🔍 Resumen de Cambios para QA" >> $GITHUB_STEP_SUMMARY
          echo "**Mensaje del commit:** ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
          echo "**Autor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "### Archivos modificados/añadidos:" >> $GITHUB_STEP_SUMMARY
          git diff-tree --no-commit-id --name-status -r ${{ github.sha }} >> $GITHUB_STEP_SUMMARY

  deploy-to-render:
    name: 🚀 Desplegar en Render (Producción)
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Disparar Deploy Hook en Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "¡Despliegue aprobado y enviado a Render!"