name: CI/CD Pipeline con QA

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: 🧪 Validar Código e Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Validar sintaxis del Dockerfile
        run: docker build -t test-image .

      - name: Confirmación de pruebas pasadas
        run: echo "¡Validaciones de QA pasadas con éxito!"

  deploy-to-render:
    name: 🚀 Desplegar en Render (Producción)
    needs: build-and-test
    runs-on: ubuntu-latest
    # AQUÍ ESTÁ EL TRUCO:
    environment: production

    steps:
      - name: Disparar Deploy Hook en Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "¡Despliegue aprobado y enviado a Render!"